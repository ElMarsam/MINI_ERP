name: coworking_erp
description: "Coworking Space ERP Desktop - Enterprise Resource Planning System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Supabase
  supabase_flutter: ^2.9.1

  # Navigation
  go_router: ^15.1.2

  # UI & Icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.25
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  dartz: ^0.10.1
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Local Storage
  shared_preferences: ^2.5.3

  # PDF Reports
  pdf: ^3.11.1
  printing: ^5.14.2

  # Date/Time
  syncfusion_flutter_datepicker: ^29.1.40

  # Charts & Analytics
  fl_chart: ^0.70.2

  # Logging
  logger: ^2.5.0
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.7.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600

  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/
